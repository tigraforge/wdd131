<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn about Nigeria, its people, culture, and weather.">
    <meta name="author" content="Mary Akintade">
    <title>Nigeria | WDD 131</title>
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Nigeria</h1>
    </header>

    <main>
        <section class="hero">
            <picture>
                <source media="(max-width: 700px)" srcset="images/nigeria-small.webp">
                <img src="images/nigeria-large.webp" alt="Beautiful landscape in Nigeria">
            </picture>
        </section>

        <section class="content">
            <section class="card">
                <h2>About Nigeria</h2>
                <div class="info">
                    <p><strong>Capital:</strong> Abuja</p>
                    <p><strong>Population:</strong> Over 230 million</p>
                    <p><strong>Official Language:</strong> English</p>
                    <p><strong>Currency:</strong> Nigerian Naira (₦)</p>
                    <p><strong>Continent:</strong> Africa</p>
                </div>
            </section>

            <section class="card weather">
                <h2>Weather</h2>

                <div class="weather-icon">
                    <img src="images/weather.jpg" alt="Partly cloudy weather">
                </div>

                <div class="weather-info">
                    <p><strong>Temperature:</strong> <span id="temperature">28 °C</span></p>
                    <p><strong>Conditions:</strong> Partly Cloudy</p>
                    <p><strong>Wind:</strong> <span id="wind-speed">10 km/h</span></p>
                    <p><strong>Wind Chill:</strong> <span id="wind-chill">N/A</span></p>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>
            © <span id="currentyear"></span> Mary Akintade | Nigeria
        </p>
        <p>
            Last Modified: <span id="lastmodified"></span>
        </p>
    </footer>
</body>

</html>
